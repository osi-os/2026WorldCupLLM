services:
  app:
    build: .
    container_name: worldcup-app
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Inside the compose network, reach Postgres by service name.
      # (app.py calls load_dotenv() with override=False, so this wins over .env)
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DB_PATH: /app/kb/fifa_worldcup.duckdb
      EMB_PATH: /app/kb/embeddings.npy
      EMB_META_PATH: /app/kb/embeddings_meta.json
    volumes:
      - ./source_data:/app/source_data        # Kaggle CSVs (see README prerequisites)
      - ./models:/app/models                   # ONNX model (auto-downloaded if absent)
      - kb_data:/app/kb                        # persisted knowledge base + embeddings
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: worldcup-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: worldcup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d worldcup"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: worldcup-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  grafana_data:
  kb_data: